name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every Linux job in this repository runs on ubuntu-24.04, not ubuntu-latest. Playwright 1.60.0 has
# no Chromium build for Ubuntu 26.04, and the visual baselines depend on the image. Issue #696
# moves the pin together with the Playwright upgrade.
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    outputs:
      unit-selection: ${{ steps.select.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Select unit tests (pull requests)
        id: select
        if: github.event_name == 'pull_request'
        run: node scripts/ci/select-tests.mjs --base "origin/${{ github.base_ref }}"
      - name: Unit tests (selected)
        if: github.event_name == 'pull_request' && steps.select.outputs.mode == 'some'
        run: pnpm exec vitest run --project unit ${{ steps.select.outputs.paths }}
      - name: Unit tests (skipped note)
        if: github.event_name == 'pull_request' && steps.select.outputs.mode == 'none'
        run: echo "No unit-bearing layers changed; the full suite runs in the merge queue."
      - name: Unit tests (full)
        if: github.event_name != 'pull_request' || steps.select.outputs.mode == 'all'
        run: pnpm test
      - name: Integration-acceptance audit
        run: pnpm integration:audit
      - name: Build
        run: pnpm build

  storage-browser:
    name: Storage backends (chromium)
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 15
    # Follows the unit tests: skipped on a pull request whose changes select no unit tests, and
    # always run on the other events.
    if: github.event_name != 'pull_request' || needs.check.outputs.unit-selection != 'none'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the storage backends in a real browser
        run: pnpm test:storage-browser

  decide:
    name: Decide heavy suites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.d.outputs.e2e }}
      visual: ${{ steps.d.outputs.visual }}
      lighthouse: ${{ steps.d.outputs.lighthouse }}
      scene: ${{ steps.scene.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Decide
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/decide.mjs --base "origin/${{ github.base_ref }}"
      # Gate the scene-visual job on whether any -linux scene baseline is committed. The
      # scene tier renders on a real GPU on the development Mac (ADR-0149); its CI lane only
      # becomes meaningful once the runner-rendered -linux baselines are seeded via the
      # refresh-scene-baselines workflow after this lands. Until then this reports false and
      # the scene-visual job skips cleanly.
      - name: Detect committed linux scene baselines
        id: scene
        run: |
          if [ -n "$(find e2e/tests -type f -name '*-scene-webgl-linux.png' -print -quit)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  ping-pong:
    name: Ping-pong compliance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit the red-green-blue commit history
        run: pnpm rgb:audit --range "origin/${{ github.base_ref }}..HEAD"

  policy:
    name: Repository policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check commits and changes against repository policy
        env:
          POLICY_BASE: origin/${{ github.base_ref }}
          POLICY_HEAD: ${{ github.event.pull_request.head.sha }}
          POLICY_BRANCH: ${{ github.head_ref }}
          POLICY_FORK_FLAG: ${{ github.event.pull_request.head.repo.full_name != github.repository && '--fork-pr' || '' }}
        run: pnpm policy:check --base "$POLICY_BASE" --head "$POLICY_HEAD" --branch "$POLICY_BRANCH" $POLICY_FORK_FLAG

  green-proof:
    name: GREEN proof
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Prove each GREEN commit with its RED tests
        env:
          PROOF_RANGE: origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
        run: pnpm green:proof --range "$PROOF_RANGE" --mutation-budget-minutes 15

  storybook-build:
    name: Storybook build and component tests
    runs-on: ubuntu-24.04
    needs: [check, decide]
    if: needs.decide.outputs.visual == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Storybook component tests
        run: pnpm storybook:test
      - name: Build Storybook
        run: pnpm build-storybook
      # The committed story baselines are rendered on this runner architecture
      # via the refresh-story-baselines workflow, so a drift here is a real
      # visual change. Regenerate them with that workflow when the change is
      # intentional.
      - name: Visual-regression diff of Storybook stories
        id: story-visual-tests
        run: pnpm stories:test
      - name: Warn about tests that passed only on a retry
        if: ${{ !cancelled() && steps.story-visual-tests.conclusion != 'skipped' }}
        run: node scripts/ci/retry-warning.mjs reports/playwright/story-results.json
      - name: Upload static Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7
      # The report is kept for every run, green ones too, so that a failed first attempt in a
      # green run can be read later. The name carries the run attempt: a re-run that reuses a
      # fixed name may be refused (a name conflict), so each attempt keeps its own artifact name.
      - name: Upload story visual report
        if: ${{ !cancelled() && steps.story-visual-tests.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-visual-report-attempt-${{ github.run_attempt }}
          path: |
            playwright-report
            reports/playwright
          retention-days: 7

  e2e:
    name: End-to-end (chromium)
    runs-on: ubuntu-24.04
    needs: [check, decide]
    if: needs.decide.outputs.e2e == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build production bundle
        run: pnpm build
      - name: Run Playwright (chromium)
        id: e2e-tests
        run: pnpm exec playwright test --project=chromium
      - name: Warn about tests that passed only on a retry
        if: ${{ !cancelled() && steps.e2e-tests.conclusion != 'skipped' }}
        run: node scripts/ci/retry-warning.mjs reports/playwright/results.json
      # The report is kept for every run, green ones too, so that a failed first attempt in a
      # green run can be read later. The name carries the run attempt: a re-run that reuses a
      # fixed name may be refused (a name conflict), so each attempt keeps its own artifact name.
      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.e2e-tests.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: |
            playwright-report
            reports/playwright
          retention-days: 7

  scene-visual:
    name: Scene visual regression (chromium/SwiftShader)
    runs-on: ubuntu-24.04
    needs: [check, decide]
    # Runs only once runner-rendered -linux scene baselines are committed (see the decide job's
    # detection step). Skips cleanly on any tree that has none, which is every tree today.
    if: needs.decide.outputs.scene == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build production bundle
        run: pnpm build
      # The committed -linux scene baselines are rendered on this runner architecture via the
      # refresh-scene-baselines workflow, so a drift here is a real visual change. On linux the
      # scene-webgl project falls back to SwiftShader (no GPU on the runner); regenerate the
      # baselines with that workflow when the change is intentional.
      - name: Scene visual-regression diff (scene-webgl project)
        id: scene-visual-tests
        run: pnpm exec playwright test --project=scene-webgl
      - name: Warn about tests that passed only on a retry
        if: ${{ !cancelled() && steps.scene-visual-tests.conclusion != 'skipped' }}
        run: node scripts/ci/retry-warning.mjs reports/playwright/results.json
      # The report is kept for every run, green ones too, so that a failed first attempt in a
      # green run can be read later. The name carries the run attempt: a re-run that reuses a
      # fixed name may be refused (a name conflict), so each attempt keeps its own artifact name.
      - name: Upload scene visual report
        if: ${{ !cancelled() && steps.scene-visual-tests.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: scene-visual-report-attempt-${{ github.run_attempt }}
          path: |
            playwright-report
            reports/playwright
          retention-days: 7

  live-view-visual:
    name: Live-view visual regression (macOS/WebGPU)
    runs-on: macos-15
    needs: [check, decide]
    # Pixel-tests the render path users actually see: the editor's live WebGPU pane on a
    # Metal-backed adapter, which the linux runners cannot provide (the spec self-skips
    # there). The probe run 34067553157 showed that chromium on a macOS runner exposes a real
    # WebGPU adapter and renders within the committed -darwin baseline's standing tolerances,
    # so one baseline serves the development Mac and this runner. That probe ran on macos-14.
    # GitHub retired that image in November 2026, and macos-15 is the nearest supported one.
    # The image is pinned by number so that a move to a newer one is a deliberate change.
    # macOS minutes bill at 10x linux, so the job shares the e2e gate: it runs only when the
    # PR touches a path that can move the live frame (ADR-0171).
    # The same adapter also runs four journeys under the chromium project. The perceived-color
    # journey clicks a painted wall face in the live pane and checks that the inspector shows the
    # sampled color for that face. The close-openings journey opens doors and windows in walk
    # mode, closes them from the 3D toolbar, and reads the opening's region of the live canvas on
    # each animation frame the page lets it read. It needs a runner that draws at least about
    # eight frames a second: a swing lasts a quarter of a second, and the spec fails if it reads
    # no part-open frame. It shows that no frame it read has an opening in the wrong state, not
    # that it read every frame the page drew (issue #778 tracks a possible flash). The walk-view
    # journey takes the walker's view of a shut door, rebuilds the scene in orbit mode, and
    # checks that the walker's view afterward matches the first one. The journey of the walker
    # and the active floor makes another floor active during a walk, and checks that the walker's
    # view stays the same and that E opens the door of the upper floor in sight. A third test walks
    # on a basement that the whole-building view hides and checks that the basement is drawn. All four
    # self-skip on the linux e2e runner, so this job is where they actually run, and each step
    # sets E2E_REQUIRE_WEBGPU so that a runner with no adapter fails it instead of skipping it.
    # The specs take the scene-webgl project's browser channel and GPU flags themselves, so they
    # run under the chromium project with the browsers installed below.
    # The live-view start-up spec runs here too, in the scene-webgl project. Its last test is the
    # only real-browser test of the Reload page button after a failed load of the renderer
    # module, and its other three hold the renderer start-up open. The linux scene-visual job
    # runs the same four tests through three's WebGL 2 fallback, because that runner has no
    # adapter. This step runs them on the WebGPU path with a real adapter, and it sets
    # E2E_REQUIRE_WEBGPU so that a runner that loses its adapter fails the step instead of
    # falling back.
    if: needs.decide.outputs.e2e == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The macOS browser cache lives under ~/Library/Caches, not the linux ~/.cache path
      # the scene-visual job uses; caching it keeps the 10x-priced runner off a fresh
      # chromium download on every triggered run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Build production bundle
        run: pnpm build
      - name: Live-view visual-regression diff (scene-webgl project)
        id: live-view-first-test
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/playwright/live-view-visual-regression.json
        run: pnpm exec playwright test --project=scene-webgl e2e/tests/scene-live-view-visual-regression.spec.ts --reporter=list,json --output=test-results/visual-regression
      - name: Perceived-color readout journey (chromium project)
        env:
          E2E_REQUIRE_WEBGPU: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/playwright/live-view-perceived-color.json
        run: pnpm exec playwright test --project=chromium e2e/tests/journeys/perceived-color-readout.spec.ts --reporter=list,json --output=test-results/perceived-color
      - name: Close-openings journey (chromium project)
        # The run takes about a minute on the development Mac. Each of its six tests may take up
        # to 120 s, and retries: 2 can run a failed test three times, so a failing run could last
        # 36 minutes or more. Fifteen minutes is about fifteen times the local run, enough for a
        # slow runner and a retry or two, and it ends a hung run early.
        timeout-minutes: 15
        env:
          E2E_REQUIRE_WEBGPU: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/playwright/live-view-close-openings.json
        run: pnpm exec playwright test --project=chromium e2e/tests/journeys/close-doors-and-windows.spec.ts --reporter=list,json --output=test-results/close-openings
      - name: Walk-view journey after a scene rebuild (chromium project)
        # Four tests, each with a limit of two minutes and up to two retries.
        timeout-minutes: 26
        env:
          E2E_REQUIRE_WEBGPU: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/playwright/live-view-walk-after-rebuild.json
        run: pnpm exec playwright test --project=chromium e2e/tests/journeys/walk-view-after-rebuild.spec.ts --reporter=list,json --output=test-results/walk-after-rebuild
      - name: Walker follows the active floor journey (chromium project)
        # Three tests, each with a limit of two minutes and up to two retries.
        timeout-minutes: 19
        env:
          E2E_REQUIRE_WEBGPU: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/playwright/live-view-walk-active-floor.json
        run: pnpm exec playwright test --project=chromium e2e/tests/journeys/walk-follows-the-active-floor.spec.ts --reporter=list,json --output=test-results/walk-active-floor
      - name: Live-view start-up spec (scene-webgl project)
        # The run takes about eight seconds on the development Mac. The visual-regression step
        # and the perceived-color journey step take 10 to 21 seconds on this runner. Each test
        # may take up to 30 s, and retries: 2 can run a failed test three times, so a full hang
        # could last six minutes or more. Five minutes lets two hung tests finish their retries
        # (30 s for each of three tries) and write their traces, and it still ends a hung run
        # early.
        timeout-minutes: 5
        env:
          E2E_REQUIRE_WEBGPU: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/playwright/live-view-startup.json
        run: pnpm exec playwright test --project=scene-webgl e2e/tests/scene-live-view-startup.spec.ts --reporter=list,json --output=test-results/startup
      - name: Edge overlay GPU resource spec (scene-webgl project)
        # One test that flips the surface-edge overlay ten times and expects the live renderer's
        # geometry and texture counts to stay flat. It takes about ten seconds on the development
        # Mac. Five minutes covers two retries and their traces, and it ends a hung run early.
        timeout-minutes: 5
        env:
          E2E_REQUIRE_WEBGPU: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/playwright/live-view-edge-overlay.json
        run: pnpm exec playwright test --project=scene-webgl e2e/tests/scene-edge-overlay-resources.spec.ts --reporter=list,json --output=test-results/edge-overlay
      # In a green run with no retry pass, the summary of this step must say `Reports read: 7`, one
      # report for each test step above. A smaller number there means a step wrote no JSON report.
      # In a red run, the steps after the failed one are skipped, so the count is lower.
      # The condition names the first test step only. If it was skipped, no test step ran
      # (an install or build step failed before them), so there is nothing to check or upload.
      - name: Warn about tests that passed only on a retry
        if: ${{ !cancelled() && steps.live-view-first-test.conclusion != 'skipped' }}
        run: node scripts/ci/retry-warning.mjs reports/playwright/live-view-*.json
      # The report is kept for every run, green ones too, so that a failed first attempt in a
      # green run can be read later. The name carries the run attempt: a re-run that reuses a
      # fixed name may be refused (a name conflict), so each attempt keeps its own artifact name.
      - name: Upload live-view report
        if: ${{ !cancelled() && steps.live-view-first-test.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-view-visual-report-attempt-${{ github.run_attempt }}
          path: |
            test-results
            reports/playwright
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-24.04
    needs: [check, decide]
    if: needs.decide.outputs.lighthouse == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chrome for Lighthouse
        uses: browser-actions/setup-chrome@v1
      - name: Build production bundle
        run: pnpm build
      - name: Run Lighthouse CI
        run: pnpm lhci
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci
          path: .lighthouseci
          retention-days: 7

  ci-complete:
    name: ci-complete
    if: always()
    runs-on: ubuntu-24.04
    needs:
      [
        check,
        storage-browser,
        decide,
        ping-pong,
        policy,
        green-proof,
        storybook-build,
        e2e,
        scene-visual,
        live-view-visual,
        lighthouse,
      ]
    steps:
      - name: Gate on required jobs
        run: |
          echo "check=${{ needs.check.result }} storage-browser=${{ needs.storage-browser.result }} decide=${{ needs.decide.result }} ping-pong=${{ needs.ping-pong.result }} policy=${{ needs.policy.result }} green-proof=${{ needs.green-proof.result }} storybook=${{ needs.storybook-build.result }} e2e=${{ needs.e2e.result }} scene-visual=${{ needs.scene-visual.result }} live-view-visual=${{ needs.live-view-visual.result }} lighthouse=${{ needs.lighthouse.result }}"
          for result in "${{ needs.check.result }}" "${{ needs.storage-browser.result }}" "${{ needs.decide.result }}" "${{ needs.ping-pong.result }}" "${{ needs.policy.result }}" "${{ needs.green-proof.result }}" "${{ needs.storybook-build.result }}" "${{ needs.e2e.result }}" "${{ needs.scene-visual.result }}" "${{ needs.live-view-visual.result }}" "${{ needs.lighthouse.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job did not pass: $result"
              exit 1
            fi
          done
          echo "All gating jobs passed or were skipped."
