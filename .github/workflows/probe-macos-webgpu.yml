name: Probe macOS runner WebGPU

# Temporary probe for rendering-realism lane 3 (issue #469): does the macOS runner's
# chromium expose a WebGPU adapter, and if so, does the live-view render match the
# development Mac's committed baseline? This workflow lives only on the lane branch and
# is removed (or reshaped into the real lane) before merge. Push-triggered because
# workflow_dispatch registers only on the default branch.

on:
  push:
    branches: [feat/live-view-ci-render-lane]

jobs:
  probe:
    name: Live-view spec on the macOS runner
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Build production bundle
        run: pnpm build
      - name: Run the live-view visual spec
        run: pnpm exec playwright test --project=scene-webgl e2e/tests/scene-live-view-visual-regression.spec.ts --reporter=list
      - name: Upload actual render on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-view-probe-render
          path: test-results/
          retention-days: 3
