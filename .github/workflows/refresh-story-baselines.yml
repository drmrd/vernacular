name: Refresh story baselines

# Manually dispatched helper that regenerates every committed Storybook story
# visual-regression baseline on the amd64 runner that gates them, then uploads
# them as an artifact to download and commit. Run this after an intentional
# visual change to a story or the design system: download the `story-baselines`
# artifact, replace e2e/stories/__screenshots__/ with its contents, and commit.
# Developer machines are arm64 and emulated amd64 chromium crashes under qemu, so
# the runner is the only place these render to match CI. See ADR-0117.

on:
  workflow_dispatch:

jobs:
  refresh:
    name: Regenerate story baselines on the runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Regenerate story baselines
        run: pnpm exec playwright test --config playwright.stories.config.ts --update-snapshots=all
      - name: Upload refreshed baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-baselines
          path: e2e/stories/__screenshots__
          retention-days: 7
