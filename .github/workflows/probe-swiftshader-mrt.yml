name: Probe SwiftShader MRT extensions

# Temporary probe for rendering-realism lane 5 (issue #471): does the linux runner's
# chromium-under-SwiftShader WebGL 2 context expose the extensions a multiple-render-target
# normals channel needs (OES_draw_buffers_indexed for per-attachment blending,
# EXT_color_buffer_float / EXT_color_buffer_half_float for the attachment format)?
# Lives only on the lane branch; removed before merge.

on:
  push:
    branches: [feat/ao-normals-render-target]

jobs:
  probe:
    name: List WebGL 2 extensions under SwiftShader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Probe the WebGL 2 extension list
        run: |
          node - <<'SCRIPT'
          const { chromium } = require('@playwright/test')
          async function main() {
            const browser = await chromium.launch()
            const page = await browser.newPage()
            const report = await page.evaluate(() => {
              const canvas = document.createElement('canvas')
              const gl = canvas.getContext('webgl2')
              if (!gl) return { ok: false }
              const dbg = gl.getExtension('WEBGL_debug_renderer_info')
              return {
                ok: true,
                renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown',
                extensions: gl.getSupportedExtensions(),
              }
            })
            console.log('WEBGL2_OK:', report.ok)
            console.log('RENDERER:', report.renderer)
            for (const name of [
              'OES_draw_buffers_indexed',
              'EXT_color_buffer_float',
              'EXT_color_buffer_half_float',
            ]) {
              console.log(name + ':', report.extensions ? report.extensions.includes(name) : 'n/a')
            }
            console.log('ALL_EXTENSIONS:', JSON.stringify(report.extensions))
            await browser.close()
          }
          main().catch((error) => { console.error(error); process.exit(1) })
          SCRIPT
